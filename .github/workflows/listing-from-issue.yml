# Turns an issue made by the listing form into a pull request: checks the
# links, commits the listing to a branch named after the file, and opens a
# pull request (CODEOWNERS asks the maintainers to review it). Editing the
# issue updates the pull request. See scripts/listing_from_issue.py.
#
# Needs Settings → Actions → General → "Allow GitHub Actions to create and
# approve pull requests". The link check runs here, before anything is
# committed. On the pull requests this workflow opens, GitHub holds the
# "Check listings" run until a maintainer approves it ("Approve and run").
name: Listing from issue
run-name: "Listing from issue #${{ github.event.issue.number }}"

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: listing-issue-${{ github.event.issue.number }}

jobs:
  pull-request:
    if: >-
      github.event.issue.state == 'open'
      && contains(github.event.issue.body, '<!-- listing-form:')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install "PyYAML>=6,<7"

      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }} # never the parent repository of a fork
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/listing_from_issue.py
